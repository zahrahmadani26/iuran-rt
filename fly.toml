# ============================================================
# Fly.io Configuration File: SI-IURAN RT
# App Name: iuran-rt-zahrahmadani
# Region: Singapore (sin) - Latensi rendah untuk Indonesia
# ============================================================
app = 'iuran-rt-zahrahmadani'
primary_region = 'sin'

[build]
  dockerfile = 'Dockerfile'

[env]
  APP_ENV = 'production'
  APP_DEBUG = 'false'
  APP_URL = 'https://iuran-rt-zahrahmadani.fly.dev'
  LOG_CHANNEL = 'stderr'
  LOG_LEVEL = 'info'
  DB_CONNECTION = 'sqlite'
  DB_DATABASE = '/var/www/html/database/database.sqlite'
  SESSION_DRIVER = 'file'
  CACHE_STORE = 'file'
  QUEUE_CONNECTION = 'sync'
  PHP_OPCACHE_INTERNED_STRINGS_BUFFER = '8'
  PHP_OPCACHE_MEMORY_CONSUMPTION = '64'

[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 1
  processes = ['app']

[[vm]]
  memory = '512mb'
  cpu_kind = 'shared'
  cpus = 1

[mounts]
  source = 'iuran_data'
  destination = '/var/www/html/database'
  initial_size = '1gb'
